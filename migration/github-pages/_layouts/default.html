<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    {% seo %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <style>
      .site-nav { margin: 1.5rem auto 0; max-width: 64rem; display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; }
      .site-nav a { color: #fff; border: 1px solid rgba(255,255,255,.45); border-radius: .3rem; padding: .35rem .7rem; text-decoration: none; }
      .site-nav a:hover, .site-nav a:focus { background: rgba(255,255,255,.2); text-decoration: underline; }
      .page-footer-nav { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #eff0f1; }
    </style>
  </head>
  <body>
    <a id="skip-to-content" href="#content">Skip to the content.</a>
    <header class="page-header" role="banner">
      <h1 class="project-name">{{ page.title | default: site.title }}</h1>
      <h2 class="project-tagline">{{ page.description | default: site.description }}</h2>
      <nav class="site-nav" aria-label="Site navigation">
        <a href="{{ '/' | relative_url }}">Home / Contents</a>
        <a href="{{ '/standard/10-hs-base.html' | relative_url }}">HS-BASE</a>
        <a href="{{ '/standard/20-student-eligibility.html' | relative_url }}">Student eligibility</a>
        <a href="{{ site.github.repository_url }}">Source on GitHub</a>
      </nav>
    </header>
    <main id="content" class="main-content" role="main">
      {{ content }}
      <nav class="page-footer-nav" aria-label="Page navigation">
        <a href="{{ '/' | relative_url }}">← Home / Contents</a>
      </nav>
      <footer class="site-footer">
        <span class="site-footer-owner"><a href="{{ site.github.repository_url }}">{{ site.github.repository_name }}</a> is maintained by <a href="{{ site.github.owner_url }}">{{ site.github.owner_name }}</a>.</span>
      </footer>
    </main>
  </body>
</html>
